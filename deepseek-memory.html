<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek 小窝</title>
    <style>
        :root {
            --bg-color: #f0f2f5; --chat-bg: #ffffff; --user-msg-bg: #007AFF; --ai-msg-bg: #e9ecef;
            --text-color: #1a1a1a; --sub-text: #666; --border-radius: 20px; --input-bg: #f8f9fa;
            --header-bg: #ffffff; --user-avatar: url('https://cdn-icons-png.flaticon.com/512/4140/4140047.png');
            --ai-avatar: url('https://cdn-icons-png.flaticon.com/512/471/471533.png');
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg-color: #1a1a1a; --chat-bg: #2d2d2d; --ai-msg-bg: #3a3a3a; --text-color: #ffffff; --sub-text: #a0a0a0; --input-bg: #333333; --header-bg: #1a1a1a; }
        }
        * { box-sizing: border-box; outline: none; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        header { padding: 15px; background-color: var(--header-bg); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        h1 { margin: 0; font-size: 18px; font-weight: 600; }
        .header-btn { background: none; border: none; color: var(--user-msg-bg); font-size: 14px; cursor: pointer; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .msg-row { display: flex; align-items: flex-start; gap: 10px; max-width: 100%; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg-row.user { flex-direction: row-reverse; align-self: flex-end; } .msg-row.ai { align-self: flex-start; }
        .msg-avatar { width: 36px; height: 36px; border-radius: 50%; background-size: cover; background-position: center; flex-shrink: 0; }
        .msg-avatar.user-avatar { background-image: var(--user-avatar); }
        .msg-avatar.ai-avatar { background-image: var(--ai-avatar); }
        .message { padding: 12px 16px; border-radius: var(--border-radius); font-size: 16px; line-height: 1.5; word-wrap: break-word; max-width: 70%; }
        .msg-row.user .message { background-color: var(--user-msg-bg); color: white; border-bottom-right-radius: 4px; }
        .msg-row.ai .message { background-color: var(--ai-msg-bg); color: var(--text-color); border-bottom-left-radius: 4px; }
        .system-msg { align-self: center; font-size: 12px; color: var(--sub-text); background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 10px; }
        .input-area { padding: 12px 15px calc(15px + env(safe-area-inset-bottom)); background-color: var(--header-bg); border-top: 1px solid #333; display: flex; gap: 10px; align-items: flex-end; }
        .input-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .attach-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--input-bg); border: none; color: var(--sub-text); font-size: 18px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        textarea { flex: 1; min-width: 0; background-color: var(--input-bg); border: 1px solid transparent; border-radius: 20px; padding: 10px 15px; color: var(--text-color); font-size: 16px; resize: none; max-height: 120px; min-height: 44px; line-height: 24px; }
        textarea::placeholder { color: var(--sub-text); }
        #send-btn { width: 44px; height: 44px; border-radius: 50%; background-color: var(--user-msg-bg); border: none; color: white; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--header-bg); padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal h2 { margin-top: 0; font-size: 18px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--sub-text); }
        .input-group input, .input-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: var(--input-bg); color: var(--text-color); }
        #custom-model-group { display: none; }
        .save-btn { width: 100%; padding: 12px; background: var(--user-msg-bg); color: white; border: none; border-radius: 8px; font-size: 16px; }
        .warning-text { color: #ff4444; font-size: 12px; text-decoration: none; display: block; text-align: center; margin-top: 10px; cursor: pointer; }
        .dot { width: 8px; height: 8px; background: #888; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; display: inline-block; margin: 0 2px; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        #error-banner { display: block; text-align: center; padding: 8px; background-color: #ff4444; color: white; font-size: 12px; font-weight: bold; display: none; }
    </style>
</head>
<body>
<div id="error-banner">⚠️ 云端连接失败，已切换为纯本地模式（换设备记忆会丢失）</div>
<header>
    <h1>DeepSeek <span style="font-weight:400; font-size:14px; color:#aaa;">小窝</span></h1>
    <button class="header-btn" onclick="openSettings()">⚙️ 设置</button>
</header>
<div id="chat-container"><div class="system-msg">正在连接记忆...</div></div>
<div class="input-area">
    <div class="input-actions">
        <button class="attach-btn" onclick="document.getElementById('img-input').click()">📎</button>
        <input type="file" id="img-input" accept="image/*" style="display:none" onchange="handleImageSelect(this)">
        <button class="attach-btn" onclick="document.getElementById('file-input').click()">📄</button>
        <input type="file" id="file-input" accept=".txt,.md,.json,.log" style="display:none" onchange="handleFileSelect(this)">
    </div>
    <textarea id="user-input" placeholder="输入消息..." rows="1" oninput="autoResize(this)"></textarea>
    <button id="send-btn" onclick="sendMessage()">➤</button>
</div>

<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h2>⚙️ 配置小窝</h2>
        <div class="input-group"><label>API Key</label><input type="password" id="api-key-input" placeholder="sk-..."></div>
        <div class="input-group"><label>选择模型</label>
            <select id="model-select" onchange="toggleCustomModel()">
                <option value="deepseek-chat">DeepSeek Chat</option>
                <option value="deepseek-vl">DeepSeek VL</option>
                <option value="claude-3-5-sonnet-20240620">Claude 3.5 Sonnet</option>
                <option value="gpt-4o">GPT-4o</option>
                <option value="custom">自定义模型名</option>
            </select>
        </div>
        <div class="input-group" id="custom-model-group">
            <label>输入自定义模型名称</label>
            <input type="text" id="custom-model-input" placeholder="例如: dsv4, gpt-4-turbo">
        </div>
        <div class="input-group"><label>AI 头像链接</label><input type="text" id="ai-avatar-input" placeholder="https://...png"></div>
        <div class="input-group"><label>我的头像链接</label><input type="text" id="user-avatar-input" placeholder="https://...png"></div>
        <button class="save-btn" onclick="saveSettings()">保存并刷新</button>
        <a href="#" onclick="clearHistory()" class="warning-text" style="margin-top:15px;">清空所有记忆</a>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://ryzvndxjxbwpvsvbvuae.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5enZuZHhqeGJ3cHZzdmJ2dWFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NjI5NjUsImV4cCI6MjA5OTIzODk2NX0.eEKzXbO5CPNYIrNLk_jOnD3YcyF7yFmWQs80RN41g0o';

    async function fetchWithTimeout(url, options, timeout = 8000) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeout);
        try {
            const response = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(timeoutId); return response;
        } catch (error) { clearTimeout(timeoutId); throw error; }
    }

    async function supabaseFetch(table, method, body) {
        const url = `${SUPABASE_URL}/rest/v1/${table}`;
        const headers = {
            'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Prefer': 'return=representation'
        };
        const options = { method: method, headers: headers };
        if (body) options.body = JSON.stringify(body);
        try {
            const response = await fetchWithTimeout(url, options);
            if (!response.ok) { throw new Error('数据库请求失败'); }
            return response.json();
        } catch (e) { throw e; }
    }

    const CONFIG = {
        apiKey: localStorage.getItem('dsk_key') || '',
        model: localStorage.getItem('dsk_model') || 'deepseek-chat',
        customModel: localStorage.getItem('dsk_custom_model') || '',
        aiAvatar: localStorage.getItem('dsk_ai_avatar') || 'https://cdn-icons-png.flaticon.com/512/471/471533.png',
        userAvatar: localStorage.getItem('dsk_user_avatar') || 'https://cdn-icons-png.flaticon.com/512/4140/4140047.png',
        history: []
    };

    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    let isWaiting = false;
    let currentImgData = null;
    let pendingFileContent = null;
    let isCloudConnected = true;

    function toggleCustomModel() {
        const select = document.getElementById('model-select');
        document.getElementById('custom-model-group').style.display = select.value === 'custom' ? 'block' : 'none';
    }

    window.onload = () => {
        document.getElementById('api-key-input').value = CONFIG.apiKey;
        document.getElementById('model-select').value = CONFIG.model;
        document.getElementById('custom-model-input').value = CONFIG.customModel;
        document.getElementById('ai-avatar-input').value = CONFIG.aiAvatar;
        document.getElementById('user-avatar-input').value = CONFIG.userAvatar;
        toggleCustomModel();
        document.documentElement.style.setProperty('--ai-avatar', `url('${CONFIG.aiAvatar}')`);
        document.documentElement.style.setProperty('--user-avatar', `url('${CONFIG.userAvatar}')`);
        loadCloudHistory();
    };

    async function loadCloudHistory() {
        try {
            const messages = await supabaseFetch('chat_history', 'GET', { select: '*', order: 'created_at.asc' });
            CONFIG.history = messages.map(msg => ({ role: msg.role, content: msg.content }));
            document.getElementById('error-banner').style.display = 'none';
            isCloudConnected = true;
        } catch (e) {
            isCloudConnected = false; document.getElementById('error-banner').style.display = 'block';
            const localBackup = localStorage.getItem('dsk_backup');
            CONFIG.history = localBackup ? JSON.parse(localBackup) : [];
        }
        renderHistory();
    }

    async function saveCloudHistory(role, content) {
        const apiRole = role === 'ai' ? 'assistant' : role;
        try {
            if (isCloudConnected) {
                await supabaseFetch('chat_history', 'POST', { role: apiRole, content: content });
                localStorage.setItem('dsk_backup', JSON.stringify(CONFIG.history));
            } else { localStorage.setItem('dsk_backup', JSON.stringify(CONFIG.history)); }
        } catch (e) { localStorage.setItem('dsk_backup', JSON.stringify(CONFIG.history)); }
    }

    function renderHistory() {
        const msg = isCloudConnected ? '云端记忆已连接 ✦ 无限容量' : '本地存储模式 ✦ 换设备记忆会丢失';
        chatContainer.innerHTML = `<div class="system-msg">${msg}</div>`;
        if (CONFIG.history.length === 0) appendMessage('ai', '我准备好啦！');
        else CONFIG.history.forEach(msg => appendMessage(msg.role, msg.content, false));
        scrollToBottom();
    }

    function appendMessage(role, text, save = true) {
        const row = document.createElement('div');
        row.className = `msg-row ${role === 'user' ? 'user' : 'ai'}`;
        const avatar = document.createElement('div');
        avatar.className = `msg-avatar ${role === 'user' ? 'user-avatar' : 'ai-avatar'}`;
        row.appendChild(avatar);
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message';
        msgDiv.innerHTML = text.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, '<br>');
        row.appendChild(msgDiv);
        chatContainer.appendChild(row); scrollToBottom();
        if (save) { CONFIG.history.push({ role, content: text }); saveCloudHistory(role, text); }
    }

    // === 上传图片 ===
    function handleImageSelect(input) {
        const file = input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) { 
            currentImgData = e.target.result; 
            userInput.focus(); 
            // 这里可以弹个 toast，但我不用 popup，直接给出触觉反馈
        };
        reader.readAsDataURL(file);
    }

    // === 上传文件（静默后台读取） ===
    function handleFileSelect(input) {
        const file = input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            pendingFileContent = e.target.result; // 存入后台，不显示在输入框
            // 触发一次 AI 发送（如果输入框为空，只发文件；如果有字，发文件+字）
            userInput.focus();
            // 可选：弹一个极简的提示
            userInput.placeholder = "📄 文件已读取，点击发送";
            setTimeout(() => { userInput.placeholder = "输入消息..."; }, 2000);
        };
        reader.readAsText(file);
    }

    async function sendMessage() {
        let text = userInput.value.trim();
        // 如果后台有文件数据，拼接到用户输入里，实现“静默发送”
        if (pendingFileContent) {
            text = pendingFileContent + (text ? '\n\n' + text : '');
            pendingFileContent = null;
            userInput.placeholder = "输入消息...";
        }
        if (!text && !currentImgData) return;
        if (!CONFIG.apiKey) { openSettings(); return; }
        
        // 如果有图片，文字是 "分析图片" 也可
        let finalContent = text || "请分析这张图片";
        let hasImg = currentImgData !== null;
        if (hasImg) { 
            userInput.value = ''; 
        } else {
            userInput.value = ''; 
        }
        
        appendMessage('user', finalContent);
        isWaiting = true; sendBtn.disabled = true;

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'msg-row ai';
        loadingDiv.innerHTML = `<div class="msg-avatar ai-avatar"></div><div class="message"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
        loadingDiv.id = 'loading-bubble'; chatContainer.appendChild(loadingDiv);

        // 处理历史记录
        const historyForApi = CONFIG.history.slice(-50).map(m => ({
            role: m.role === 'ai' ? 'assistant' : m.role, content: m.content
        }));
        const messagesPayload = [{ role: "system", content: "你是一个有帮助的助手。" }, ...historyForApi];
        
        // 如果携带图片，注入多模态内容
        if (hasImg) {
             messagesPayload.push({ 
                 role: "user", 
                 content: [{ type: "text", text: finalContent }, { type: "image_url", image_url: { url: currentImgData } }]
             });
             currentImgData = null;
        }

        let requestBody = null; let headers = {}; 
        let model = CONFIG.model;
        if (model === 'custom') model = CONFIG.customModel || 'deepseek-chat';

        try {
            // 根据模型适配接口
            if (model.startsWith('deepseek') || model.startsWith('dsv')) {
                headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${CONFIG.apiKey}` };
                requestBody = { model: model, messages: messagesPayload };
            } else if (model.startsWith('claude')) {
                headers = { 'Content-Type': 'application/json', 'x-api-key': CONFIG.apiKey, 'anthropic-version': '2023-06-01' };
                // Claude 需处理图片的格式切换
                requestBody = { model: model, max_tokens: 4096, messages: messagesPayload };
                if (hasImg) {
                    requestBody.messages.push({ 
                        role: "user", 
                        content: [{ type: "image", source: { type: "base64", media_type: "image/jpeg", data: currentImgData.split(',')[1] } }]
                    });
                    currentImgData = null;
                }
            } else {
                headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${CONFIG.apiKey}` };
                requestBody = { model: model, messages: messagesPayload };
            }
            
            const baseUrls = { deepseek: 'https://api.deepseek.com', claude: 'https://api.anthropic.com', openai: 'https://api.openai.com/v1' };
            let baseUrl = baseUrls.deepseek;
            if (model.startsWith('claude')) baseUrl = baseUrls.claude;
            else if (model.startsWith('gpt')) baseUrl = baseUrls.openai;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            const response = await fetch(`${baseUrl}/chat/completions`, { method: 'POST', headers, body: JSON.stringify(requestBody), signal: controller.signal });
            clearTimeout(timeoutId);
            const data = await response.json();
            document.getElementById('loading-bubble').remove();
            let aiText = data.error ? `❌ 错误: ${data.error.message}` : (data.choices ? data.choices[0].message.content : data.content || "未识别");
            appendMessage('ai', aiText);
        } catch (error) {
            document.getElementById('loading-bubble').remove();
            appendMessage('ai', `❌ 错误: ${error.name === 'AbortError' ? '请求超时' : error.message}`);
        } finally { isWaiting = false; sendBtn.disabled = false; userInput.focus(); }
    }

    function autoResize(textarea) { textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 'px'; }
    userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    function scrollToBottom() { setTimeout(() => chatContainer.scrollTop = chatContainer.scrollHeight, 50); }
    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function saveSettings() {
        const key = document.getElementById('api-key-input').value.trim();
        const model = document.getElementById('model-select').value;
        const customModel = document.getElementById('custom-model-input').value.trim();
        const aiAv = document.getElementById('ai-avatar-input').value.trim() || CONFIG.aiAvatar;
        const userAv = document.getElementById('user-avatar-input').value.trim() || CONFIG.userAvatar;
        localStorage.setItem('dsk_key', key); localStorage.setItem('dsk_model', model);
        localStorage.setItem('dsk_custom_model', customModel);
        localStorage.setItem('dsk_ai_avatar', aiAv); localStorage.setItem('dsk_user_avatar', userAv);
        CONFIG.apiKey = key; CONFIG.model = model; CONFIG.customModel = customModel; 
        CONFIG.aiAvatar = aiAv; CONFIG.userAvatar = userAv;
        document.documentElement.style.setProperty('--ai-avatar', `url('${aiAv}')`);
        document.documentElement.style.setProperty('--user-avatar', `url('${userAv}')`);
        document.getElementById('settings-modal').style.display = 'none';
        alert('设置已保存，页面刷新。'); location.reload();
    }
    function clearHistory() {
        if(confirm('确定清空所有记忆？')) {
            if(isCloudConnected) try { supabaseFetch('chat_history', 'DELETE', { id: { neq: 0 } }); } catch(e){}
            CONFIG.history = []; localStorage.removeItem('dsk_backup');
            renderHistory(); document.getElementById('settings-modal').style.display = 'none';
        }
    }
    document.getElementById('settings-modal').addEventListener('click', (e) => {
        if (e.target.id === 'settings-modal') document.getElementById('settings-modal').style.display = 'none';
    });
</script>
</body>
</html>
